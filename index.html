<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTML Трэк — Интерактивный кодинг</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --border-color: #1e293b;
            --text-main: #94a3b8;
            --text-light: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #10b981;
            --error: #f43f5e;
        }

        body.light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #475569;
            --text-light: #0f172a;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: monospace, sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Боковая панель */
        .sidebar {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .user-stats {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .lessons-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lesson-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.01);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .lesson-item:hover, .lesson-item.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
            color: var(--text-light);
        }

        .lesson-item.completed {
            border-color: var(--success);
        }

        /* Основная область */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            overflow-y: auto;
        }

        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .task-card h2 { margin-top: 0; color: var(--text-light); }
        
        .theory-box {
            background: rgba(56, 189, 248, 0.04);
            border-left: 3px solid var(--accent);
            padding: 12px 15px;
            margin: 12px 0;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-light);
            border-radius: 0 6px 6px 0;
        }

        .code-example {
            background: #04060b;
            color: #38bdf8;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: monospace;
            margin-top: 8px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        body.light .code-example {
            background: #0f172a;
            color: #38bdf8;
        }

        .task-desc {
            margin-top: 15px;
            color: var(--text-light);
            font-weight: bold;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 160px;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: #04060b;
            color: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: monospace;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
        }

        body.light textarea {
            background: #0f172a;
            color: #f8fafc;
        }

        textarea:focus { border-color: var(--accent); outline: none; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        button.action-btn {
            background: var(--accent);
            color: #0b0f19;
            border: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
        }

        button.action-btn:hover { background: var(--accent-hover); }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 13px;
        }

        .feedback.error { background: rgba(244, 63, 94, 0.1); color: var(--error); border: 1px solid var(--error); display: block; }
        .feedback.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); display: block; }

        .preview-box {
            background: #ffffff;
            color: #000000;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            min-height: 90px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>
        <span>⚡ HTML Трэк</span>
        <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </h2>
    <div class="user-stats">
        <div>Опыт: <strong id="xp-count">0</strong> XP</div>
        <div>Ранг: <strong id="level-title">Стажёр</strong></div>
    </div>
    <ul class="lessons-list" id="lessons-list"></ul>
</div>

<div class="main">
    <div class="task-card">
        <h2 id="lesson-title">Загрузка...</h2>
        <div class="theory-box" id="lesson-theory"></div>
        <div class="task-desc" id="lesson-desc"></div>
    </div>

    <div class="editor-container">
        <textarea id="code-input" placeholder="Пиши свой код здесь..."></textarea>
        <div class="btn-group">
            <button class="action-btn" onclick="checkCode()">Проверить код</button>
            <button class="action-btn" style="background: transparent; color: var(--text-main); border: 1px solid var(--border-color);" onclick="resetCode()">Сбросить</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <h3 style="margin-bottom: 5px; color: var(--text-light); font-size: 14px;">Результат в браузере:</h3>
    <div id="preview" class="preview-box"></div>
</div>
