<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTML Мастер — Интерактивный учебник</title>
    <style>
        :root {
            --bg-primary: #0f111a;
            --bg-secondary: #181a26;
            --border-color: #2d3142;
            --text-main: #a9b7c6;
            --text-light: #ffffff;
            --accent: #ffe600;
            --accent-hover: #e5cf00;
            --success: #22c55e;
            --error: #ef4444;
        }

        body.light {
            --bg-primary: #f4f4f9;
            --bg-secondary: #ffffff;
            --border-color: #d1d5db;
            --text-main: #334155;
            --text-light: #0f172a;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
        }

        * { box-sizing: border-box; }

        body {
            font-family: monospace, sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Боковая панель */
        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: var(--text-light);
            font-size: 1.2rem;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        .lessons-list {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
        }

        .lesson-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.15s;
        }

        .lesson-item:hover, .lesson-item.active {
            border-color: var(--accent);
            background: rgba(255, 230, 0, 0.05);
            color: var(--text-light);
        }

        /* Основная область */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            overflow-y: auto;
        }

        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .task-card h2 { margin-top: 0; color: var(--text-light); }

        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 200px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: #0b0d13;
            color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
        }

        body.light textarea {
            background: #1e293b;
            color: #f8fafc;
        }

        textarea:focus { border-color: var(--accent); outline: none; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button.action-btn {
            background: var(--accent);
            color: #000;
            border: 2px solid #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: 0.1s;
        }

        body.light button.action-btn {
            color: #fff;
            border-color: #312e81;
            background: var(--accent);
            box-shadow: 3px 3px 0px #312e81;
        }

        button.action-btn:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000; }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .feedback.error { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid var(--error); display: block; }
        .feedback.success { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid var(--success); display: block; }

        .preview-box {
            background: #ffffff;
            color: #000000;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            min-height: 120px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>
        <span>🛠 HTML Мастер</span>
        <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </h2>
    <ul class="lessons-list" id="lessons-list"></ul>
</div>

<div class="main">
    <div class="task-card">
        <h2 id="lesson-title">Загрузка...</h2>
        <p id="lesson-desc"></p>
    </div>

    <div class="editor-container">
        <textarea id="code-input" placeholder="Пишите HTML код здесь..."></textarea>
        <div class="btn-group">
            <button class="action-btn" onclick="checkCode()">Проверить решение</button>
            <button class="action-btn" style="background: transparent; color: var(--text-main); border-color: var(--border-color); box-shadow: none;" onclick="resetCode()">Сбросить</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <h3 style="margin-bottom: 5px; color: var(--text-light);">Живое превью:</h3>
    <div id="preview" class="preview-box"></div>
</div>

<script>
    // Массив уроков: вы можете легко добавлять сюда новые уроки или изменять тексты
    const lessons = [
        {
            title: "Урок 1: Заголовки (H1-H6)",
            desc: "Используйте тег <code>&lt;h1&gt;Ваш текст&lt;/h1&gt;</code> для создания главного заголовка страницы.",
            starter: "<h1>Привет, мир!</h1>",
            check: (code) => {
                if (!code.includes("<h1>") || !code.includes("</h1>")) {
                    return "Ошибка: вы не использовали тег <code>&lt;h1&gt;</code> или забыли его закрыть (<code>&lt;/h1&gt;</code>).";
                }
                return "";
            }
        },
        {
            title: "Урок 2: Параграфы (P)",
            desc: "Для обычного текста используется парный тег <code>&lt;p&gt;текст&lt;/p&gt;</code>.",
            starter: "<p>Это мой первый параграф в HTML.</p>",
            check: (code) => {
                if (!code.includes("<p>") || !code.includes("</p>")) {
                    return "Ошибка: каждый параграф должен начинаться с <code>&lt;p&gt;</code> и заканчиваться <code>&lt;/p&gt;</code>.";
                }
                return "";
            }
        },
        {
            title: "Урок 3: Ссылки (A)",
            desc: "Чтобы создать ссылку, используют тег <code>&lt;a href=\"адрес\"&gt;Текст ссылки&lt;/a&gt;</code>.",
            starter: "<a href=\"https://google.com\">Перейти в Google</a>",
            check: (code) => {
                if (!code.includes("<a") || !code.includes("href=") || !code.includes("</a>")) {
                    return "Ошибка: проверьте синтаксис ссылки. Убедитесь, что указан атрибут <code>href=</code> и тег закрывается <code>&lt;/a&gt;</code>.";
                }
                return "";
            }
        },
        {
            title: "Урок 4: Списки (UL / LI)",
            desc: "Маркированный список создается тегом <code>&lt;ul&gt;</code>, а его пункты — тегами <code>&lt;li&gt;</code>.",
            starter: "<ul>\n  <li>Пункт 1</li>\n  <li>Пункт 2</li>\n</ul>",
            check: (code) => {
                if (!code.includes("<ul>") || !code.includes("</ul>") || !code.includes("<li>") || !code.includes("</li>")) {
                    return "Ошибка: список должен содержать контейнер <code>&lt;ul&gt;</code> и как минимум один элемент <code>&lt;li&gt;</code>.";
                }
                return "";
            }
        }
    ];

    let currentLesson = 0;

    function renderList() {
        const list = document.getElementById("lessons-list");
        list.innerHTML = "";
        lessons.forEach((l, index) => {
            const li = document.createElement("li");
            li.className = `lesson-item ${index === currentLesson ? 'active' : ''}`;
            li.innerHTML = `<strong>${l.title}</strong>`;
            li.onclick = () => loadLesson(index);
            list.appendChild(li);
        });
    }

    function loadLesson(index) {
        currentLesson = index;
        renderList();
        document.getElementById("lesson-title").innerText = lessons[index].title;
        document.getElementById("lesson-desc").innerHTML = lessons[index].desc;
        document.getElementById("code-input").value = lessons[index].starter;
        document.getElementById("feedback").className = "feedback";
        document.getElementById("feedback").innerHTML = "";
        document.getElementById("preview").innerHTML = "";
    }

    function resetCode() {
        document.getElementById("code-input").value = lessons[currentLesson].starter;
        document.getElementById("feedback").className = "feedback";
        document.getElementById("preview").innerHTML = "";
    }

    function checkCode() {
        const code = document.getElementById("code-input").value;
        const feedback = document.getElementById("feedback");
        const preview = document.getElementById("preview");

        const errorMsg = lessons[currentLesson].check(code);

        if (errorMsg) {
            feedback.className = "feedback error";
            feedback.innerHTML = errorMsg;
            preview.innerHTML = "";
        } else {
            feedback.className = "feedback success";
            feedback.innerHTML = "✨ Великолепно! Задание выполнено правильно.";
            preview.innerHTML = code;
        }
    }

    function toggleTheme() {
        document.body.classList.toggle("light");
    }

    // Инициализация при загрузке
    loadLesson(0);
</script>

</body>
</html>
